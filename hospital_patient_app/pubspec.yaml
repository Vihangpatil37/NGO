name: hospital_patient_app
description: "ArogyaMitra Patient & Doctor App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  dio: ^5.4.0
  socket_io_client: ^3.0.0
  shared_preferences: ^2.2.0
  provider: ^6.1.5+1
  permission_handler: ^13.0.2
  flutter_local_notifications: ^22.3.0
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  firebase_auth: ^6.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
